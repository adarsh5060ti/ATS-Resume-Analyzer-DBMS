{% extends "base.html" %}
{% block title %}Edit resume · ATS Analyzer{% endblock %}
{% block content %}<p class="back"><a href="{{ url_for('resume_detail', resume_id=resume.resume_id) }}">← Resume</a></p><section class="panel narrow"><p class="eyebrow">RECORD MANAGEMENT</p><h1>Edit candidate details</h1><form method="post" class="stack-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Candidate name<input name="candidate_name" maxlength="120" required value="{{ request.form.get('candidate_name', resume.candidate_name) }}"></label><label>Email<input name="email" type="email" maxlength="254" value="{{ request.form.get('email', resume.email or '') }}"></label><label>Phone<input name="phone" maxlength="40" value="{{ request.form.get('phone', resume.phone or '') }}"></label><button class="button primary">Save changes</button></form></section>{% endblock %}
